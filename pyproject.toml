[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pebblehost-cli"
version = "0.1.0"
description = "CLI wrapper for the PebbleHost client API"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.scripts]
pebblehost = "pebblehost_cli.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
